name: TVRemote
options:
  bundleIdPrefix: com.zenithworkspaces
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: "-"
      ENABLE_TESTABILITY: YES
    Release:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 938ZF88Q6G
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGNING_REQUIRED: YES
targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: TVRemote/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenithworkspaces.tvremote
        PRODUCT_NAME: TVRemote
        INFOPLIST_FILE: TVRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TVRemoteTests
    dependencies:
      - target: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenithworkspaces.tvremote.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
        TVRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TVRemoteTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
