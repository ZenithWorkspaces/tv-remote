name: TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check App Store Connect secrets
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ASC_KEY_ID}" ] && missing+=(ASC_KEY_ID)
          [ -z "${ASC_ISSUER_ID}" ] && missing+=(ASC_ISSUER_ID)
          [ -z "${ASC_KEY_P8}" ] && missing+=(ASC_KEY_P8)
          [ -z "${APPLE_TEAM_ID}" ] && missing+=(APPLE_TEAM_ID)
          [ -z "${IOS_DIST_CERT_P12_BASE64}" ] && missing+=(IOS_DIST_CERT_P12_BASE64)
          [ -z "${IOS_DIST_CERT_PASSWORD}" ] && missing+=(IOS_DIST_CERT_PASSWORD)
          [ -z "${IOS_APPSTORE_PROFILE_BASE64}" ] && missing+=(IOS_APPSTORE_PROFILE_BASE64)
          if [ -n "${APPLE_TEAM_ID}" ] && [ "${APPLE_TEAM_ID}" != "938ZF88Q6G" ]; then
            echo "APPLE_TEAM_ID does not match the profile team 938ZF88Q6G."
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload skipped. Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add the App Store Connect API secrets and the distribution certificate secrets under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "ASC_KEY_P8 may be the raw .p8 PEM or its base64. The distribution certificate and profile must be base64. Upload targets the existing App Store Connect app for this bundle id (Apple ID 6834946756)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Signing and App Store Connect secrets are present. Continuing to archive."
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Select Xcode
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # App Store Connect rejects uploads built with the iOS 18 SDK. Use Xcode 26+.
          python3 - << 'PY'
          import glob, os, plistlib, subprocess, sys
          found = []
          for app in glob.glob("/Applications/Xcode*.app"):
              plist_path = os.path.join(app, "Contents", "Info.plist")
              if not os.path.exists(plist_path):
                  continue
              with open(plist_path, "rb") as handle:
                  info = plistlib.load(handle)
              version = str(info.get("CFBundleShortVersionString", "0"))
              parts = []
              for piece in version.split("."):
                  try:
                      parts.append(int(piece))
                  except ValueError:
                      parts.append(0)
              found.append((parts, version, app))
          found.sort()
          print("Installed Xcode:")
          for _, version, app in found:
              print(f"  {version} {app}")
          chosen = [item for item in found if item[0] and item[0][0] >= 26]
          if not chosen:
              sys.exit("Xcode 26 or newer is required to upload to App Store Connect.")
          version, app = chosen[-1][1], chosen[-1][2]
          print(f"Selecting Xcode {version}")
          subprocess.check_call(["sudo", "xcode-select", "-s", app])
          PY
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.gate.outputs.skip != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.gate.outputs.skip != 'true'
        run: xcodegen generate

      - name: Write API key
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, os, stat
          raw = os.environ.get("ASC_KEY_P8", "")
          text = raw
          if "PRIVATE KEY" not in text:
              try:
                  text = base64.b64decode(raw, validate=False).decode("utf-8")
              except Exception:
                  text = raw
          text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
          text = text.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "PRIVATE KEY" not in text:
              raise SystemExit("ASC_KEY_P8 is not a PEM private key. Provide the raw .p8 or its base64.")
          path = "/tmp/AuthKey.p8"
          flags = os.O_WRONLY | os.O_CREAT | os.O_TRUNC
          fd = os.open(path, flags, stat.S_IRUSR | stat.S_IWUSR)
          try:
              os.write(fd, text.encode("utf-8"))
          finally:
              os.close(fd)
          os.chmod(path, stat.S_IRUSR)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"ASC_KEY_PATH={path}\n")
          print("Wrote the App Store Connect API key to a temporary file.")
          PY

      - name: Choose build number
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Run 12 published build 11. Run 13 publishes build 12.
          # Later runs use the workflow run number.
          if [ "${GITHUB_RUN_NUMBER}" = "12" ]; then
            build=11
          elif [ "${GITHUB_RUN_NUMBER}" = "13" ]; then
            build=12
          else
            build="${GITHUB_RUN_NUMBER}"
          fi
          echo "BUILD_NUMBER=${build}" >> "$GITHUB_ENV"
          echo "TestFlight build number: ${build}"

      - name: Install distribution certificate and profile
        if: steps.gate.outputs.skip != 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/20c9db5e-011f-4fbd-8d77-3da5fb836214.mobileprovision"
          P12_PATH="$RUNNER_TEMP/distribution.p12"
          PEM_PATH="$RUNNER_TEMP/distribution.pem"
          MODERN_P12_PATH="$RUNNER_TEMP/distribution-modern.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          export KEYCHAIN_PASSWORD P12_PATH PEM_PATH MODERN_P12_PATH PROFILE_PATH
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          umask 077

          python3 - << 'PY'
          import base64, os, stat
          def decode(name):
              raw = "".join(os.environ[name].split())
              try:
                  return base64.b64decode(raw, validate=True)
              except Exception:
                  raise SystemExit(f"Could not decode {name}.")
          p12 = decode("IOS_DIST_CERT_P12_BASE64")
          profile = decode("IOS_APPSTORE_PROFILE_BASE64")
          if not p12.startswith(b"\x30") or len(p12) < 128:
              raise SystemExit("IOS_DIST_CERT_P12_BASE64 did not decode to a PKCS#12 blob.")
          if len(profile) < 128:
              raise SystemExit("IOS_APPSTORE_PROFILE_BASE64 decoded to an empty profile.")
          def write(path, data):
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, stat.S_IRUSR | stat.S_IWUSR)
              try:
                  os.write(fd, data)
              finally:
                  os.close(fd)
          write(os.environ["P12_PATH"], p12)
          os.makedirs(os.path.dirname(os.environ["PROFILE_PATH"]), mode=0o700, exist_ok=True)
          write(os.environ["PROFILE_PATH"], profile)
          print(f"Decoded distribution certificate ({len(p12)} bytes) and provisioning profile ({len(profile)} bytes).")
          PY

          python3 - << 'PY'
          import os, plistlib, subprocess, sys
          profile = os.environ["PROFILE_PATH"]
          decoded = subprocess.check_output(["security", "cms", "-D", "-i", profile])
          info = plistlib.loads(decoded)
          name = info.get("Name")
          uuid = info.get("UUID")
          team_ids = info.get("TeamIdentifier") or []
          team = team_ids[0] if team_ids else None
          app_id = (info.get("Entitlements") or {}).get("application-identifier")
          print(f"Profile name: {name}")
          print(f"Profile UUID: {uuid}")
          print(f"Team: {team}")
          print(f"Application identifier: {app_id}")
          expected = ("No Ads Remote App Store CI", "20c9db5e-011f-4fbd-8d77-3da5fb836214", "938ZF88Q6G", "938ZF88Q6G.com.zenithworkspaces.tvremote")
          actual = (name, uuid, team, app_id)
          if actual != expected:
              sys.exit(f"Provisioning profile does not match the CI profile. name={name!r} uuid={uuid!r} team={team!r} application-identifier={app_id!r}")
          PY

          import_p12() {
            security import "$1" -k "$KEYCHAIN_PATH" -P "$2" -A -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          }

          identity_count() {
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Apple Distribution: Zenith Workspaces LLC" || true
          }

          reset_keychain() {
            security delete-keychain "$KEYCHAIN_PATH" || true
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          }

          reset_keychain
          import_p12 "$P12_PATH" "$IOS_DIST_CERT_PASSWORD" || true
          if [ "$(identity_count)" != "1" ]; then
            echo "Keychain did not accept the stored p12 as a codesigning identity. Converting PBE-SHA1-3DES/MAC-SHA1 to a modern p12 and retrying."
            rm -f "$PEM_PATH" "$MODERN_P12_PATH"
            if ! openssl pkcs12 -in "$P12_PATH" -out "$PEM_PATH" -nodes -passin env:IOS_DIST_CERT_PASSWORD; then
              rm -f "$PEM_PATH"
              openssl pkcs12 -in "$P12_PATH" -out "$PEM_PATH" -nodes -legacy -passin env:IOS_DIST_CERT_PASSWORD
            fi
            if ! openssl pkcs12 -export -in "$PEM_PATH" -out "$MODERN_P12_PATH" -passout env:KEYCHAIN_PASSWORD -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg SHA256; then
              openssl pkcs12 -export -in "$PEM_PATH" -out "$MODERN_P12_PATH" -passout env:KEYCHAIN_PASSWORD
            fi
            rm -f "$PEM_PATH"
            reset_keychain
            import_p12 "$MODERN_P12_PATH" "$KEYCHAIN_PASSWORD"
            rm -f "$MODERN_P12_PATH"
          fi
          rm -f "$P12_PATH" "$PEM_PATH" "$MODERN_P12_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # The account has an older Apple Distribution certificate with the same
          # display name. This search list contains only the imported keychain.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          identity_count="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Apple Distribution: Zenith Workspaces LLC" || true)"
          if [ "$identity_count" != "1" ]; then
            echo "Expected exactly one Apple Distribution identity in the temporary keychain, found ${identity_count}."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "Imported one Apple Distribution identity into the temporary keychain."

      - name: Archive
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project TVRemote.xcodeproj \
            -scheme TVRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TVRemote.xcarchive" \
            DEVELOPMENT_TEAM=938ZF88Q6G \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="No Ads Remote App Store CI" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive

      - name: Export and upload
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          plist = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>938ZF88Q6G</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zenithworkspaces.tvremote</key>
              <string>No Ads Remote App Store CI</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          """
          path = os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist")
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(plist)
          print(f"Wrote manual-signing export options. Build number: {os.environ['BUILD_NUMBER']}")
          PY
          mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          install -m 600 "$ASC_KEY_PATH" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$ASC_KEY_PATH" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TVRemote.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Delete temporary keychain
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          login_keychain="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$login_keychain" ]; then
            security default-keychain -s "$login_keychain" || true
            security list-keychains -d user -s "$login_keychain" || true
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/distribution.pem" \
            "$RUNNER_TEMP/distribution-modern.p12" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/20c9db5e-011f-4fbd-8d77-3da5fb836214.mobileprovision"
          echo "Removed the temporary signing keychain and provisioning profile."

      - name: Delete API key
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            rm -f "$ASC_KEY_PATH"
          fi
          if [ -n "${ASC_KEY_ID:-}" ]; then
            rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rm -f "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
          echo "Removed temporary App Store Connect API key files."
