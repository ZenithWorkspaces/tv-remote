name: TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check App Store Connect secrets
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ASC_KEY_ID}" ] && missing+=(ASC_KEY_ID)
          [ -z "${ASC_ISSUER_ID}" ] && missing+=(ASC_ISSUER_ID)
          [ -z "${ASC_KEY_P8}" ] && missing+=(ASC_KEY_P8)
          [ -z "${APPLE_TEAM_ID}" ] && missing+=(APPLE_TEAM_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload skipped. Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, and APPLE_TEAM_ID under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "ASC_KEY_P8 may be the raw .p8 PEM or its base64. Upload targets the existing App Store Connect app for this bundle id (Apple ID 6834946756)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets are present. Continuing to archive."
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Select Xcode
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # App Store Connect rejects uploads built with the iOS 18 SDK. Use Xcode 26+.
          python3 - << 'PY'
          import glob, os, plistlib, subprocess, sys
          found = []
          for app in glob.glob("/Applications/Xcode*.app"):
              plist_path = os.path.join(app, "Contents", "Info.plist")
              if not os.path.exists(plist_path):
                  continue
              with open(plist_path, "rb") as handle:
                  info = plistlib.load(handle)
              version = str(info.get("CFBundleShortVersionString", "0"))
              parts = []
              for piece in version.split("."):
                  try:
                      parts.append(int(piece))
                  except ValueError:
                      parts.append(0)
              found.append((parts, version, app))
          found.sort()
          print("Installed Xcode:")
          for _, version, app in found:
              print(f"  {version} {app}")
          chosen = [item for item in found if item[0] and item[0][0] >= 26]
          if not chosen:
              sys.exit("Xcode 26 or newer is required to upload to App Store Connect.")
          version, app = chosen[-1][1], chosen[-1][2]
          print(f"Selecting Xcode {version}")
          subprocess.check_call(["sudo", "xcode-select", "-s", app])
          PY
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.gate.outputs.skip != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.gate.outputs.skip != 'true'
        run: xcodegen generate

      - name: Write API key
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, os, stat
          raw = os.environ.get("ASC_KEY_P8", "")
          text = raw
          if "PRIVATE KEY" not in text:
              try:
                  text = base64.b64decode(raw, validate=False).decode("utf-8")
              except Exception:
                  text = raw
          text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
          text = text.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "PRIVATE KEY" not in text:
              raise SystemExit("ASC_KEY_P8 is not a PEM private key. Provide the raw .p8 or its base64.")
          path = "/tmp/AuthKey.p8"
          flags = os.O_WRONLY | os.O_CREAT | os.O_TRUNC
          fd = os.open(path, flags, stat.S_IRUSR | stat.S_IWUSR)
          try:
              os.write(fd, text.encode("utf-8"))
          finally:
              os.close(fd)
          os.chmod(path, stat.S_IRUSR)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"ASC_KEY_PATH={path}\n")
          print("Wrote the App Store Connect API key to a temporary file.")
          PY

      - name: Register a CI device
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, json, os, subprocess, time, urllib.error, urllib.request

          def b64url(raw: bytes) -> str:
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode("ascii")

          def der_to_raw(der: bytes) -> bytes:
              # OpenSSL returns a DER SEQUENCE of two INTEGERs. ES256 needs raw R||S.
              if der[0] != 0x30:
                  raise SystemExit("Could not sign the App Store Connect token.")
              index = 2
              if der[1] & 0x80:
                  index = 2 + (der[1] & 0x7F)
              if der[index] != 0x02:
                  raise SystemExit("Could not sign the App Store Connect token.")
              index += 1
              rlen = der[index]
              index += 1
              r = der[index:index + rlen]
              index += rlen
              if der[index] != 0x02:
                  raise SystemExit("Could not sign the App Store Connect token.")
              index += 1
              slen = der[index]
              index += 1
              s = der[index:index + slen]
              return r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")

          header = b64url(json.dumps({"alg": "ES256", "kid": os.environ["ASC_KEY_ID"], "typ": "JWT"}, separators=(",", ":")).encode())
          now = int(time.time())
          payload = b64url(json.dumps({
              "iss": os.environ["ASC_ISSUER_ID"],
              "iat": now,
              "exp": now + 600,
              "aud": "appstoreconnect-v1",
          }, separators=(",", ":")).encode())
          signing_input = f"{header}.{payload}".encode()
          der = subprocess.check_output(
              ["openssl", "dgst", "-sha256", "-sign", os.environ["ASC_KEY_PATH"]],
              input=signing_input,
          )
          token = f"{header}.{payload}.{b64url(der_to_raw(der))}"
          body = json.dumps({
              "data": {
                  "type": "devices",
                  "attributes": {
                      "name": "No Ads Remote CI",
                      "platform": "IOS",
                      "udid": "00008110-000A1111111A801E",
                  },
              }
          }).encode()
          request = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/devices",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Registered CI device ({response.status}).")
          except urllib.error.HTTPError as error:
              if error.code == 409:
                  print("CI device is already registered.")
              else:
                  detail = error.read().decode("utf-8", "replace")[:500]
                  raise SystemExit(f"Could not register a CI device ({error.code}): {detail}")
          PY

      - name: Archive
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project TVRemote.xcodeproj \
            -scheme TVRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TVRemote.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export and upload
        if: steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          team = os.environ["APPLE_TEAM_ID"]
          plist = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>{team}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          """.format(team=team)
          path = os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist")
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(plist)
          PY
          mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          install -m 600 "$ASC_KEY_PATH" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$ASC_KEY_PATH" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TVRemote.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Delete API key
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            rm -f "$ASC_KEY_PATH"
          fi
          if [ -n "${ASC_KEY_ID:-}" ]; then
            rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rm -f "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
          echo "Removed temporary App Store Connect API key files."
