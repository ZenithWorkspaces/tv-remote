name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          iphones = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              version = runtime.split("iOS-")[-1].replace("-", ".")
              parts = []
              for piece in version.split("."):
                  try:
                      parts.append(int(piece))
                  except ValueError:
                      parts.append(0)
              for device in devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable") or not name.startswith("iPhone"):
                      continue
                  penalty = 0
                  if "SE" in name:
                      penalty += 2
                  if "Pro" in name:
                      penalty += 1
                  iphones.append((parts, -penalty, name, device["udid"]))
          if not iphones:
              sys.exit("No available iPhone simulator")
          iphones.sort()
          _, _, name, udid = iphones[-1]
          print(f"Using {name} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={udid}\n")
              handle.write(f"name={name}\n")
          PY

      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TVRemote.xcodeproj \
            -scheme TVRemote \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            "CODE_SIGN_IDENTITY=-" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES
